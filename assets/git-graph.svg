<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Git branching graph (terminal style)</title>
  <desc id="d">Neon terminal-style git graph showing main, develop and two feature branches with releases v1.0.0 and v1.1.0.</desc>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity="0.35"/>
    </pattern>
    <linearGradient id="vig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: "JetBrains Mono", "Fira Code", Consolas, "Courier New", monospace; font-size: 13px; fill: #00ff9c; }
    .dim { fill: #4d7a60; font-size: 11px; }
    .hdr { fill: #7dffc4; font-size: 13px; }
    .tag { font-weight: 700; text-anchor: middle; fill: #00ff9c; }
    .lbl { text-anchor: middle; }
    .line { fill: none; stroke-width: 3; stroke-linecap: round; }
    .flow { fill: none; stroke: #fff; stroke-opacity: .55; stroke-width: 1.5; stroke-dasharray: 3 17; stroke-linecap: round; animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <!-- terminal window -->
  <rect x="1" y="1" width="798" height="328" rx="10" fill="#050a07" stroke="#00ff9c" stroke-opacity=".6" stroke-width="2"/>
  <rect x="1" y="1" width="798" height="34" rx="10" fill="#0b1a12"/>
  <rect x="1" y="24" width="798" height="11" fill="#0b1a12"/>
  <circle cx="22" cy="18" r="5" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="5" fill="#ffbd2e"/>
  <circle cx="58" cy="18" r="5" fill="#27c93f"/>
  <text class="hdr" x="84" y="23">root@git:~/repo$ git log --graph --oneline --all</text>
  <rect x="1" y="35" width="798" height="294" fill="url(#vig)"/>

  <g transform="translate(0,55)">
    <!-- lines -->
    <g filter="url(#glow)">
      <path class="line" stroke="#00ff9c" d="M60 60 H740"/>
      <path class="line" stroke="#00e5ff" d="M60 60 C100 60 100 130 140 130 H680"/>
      <path class="line" stroke="#ff2bd6" d="M140 130 C170 130 170 200 200 200 H270 C305 200 305 130 340 130"/>
      <path class="line" stroke="#ffb000" d="M480 130 C510 130 510 200 540 200 H610 C645 200 645 130 680 130"/>
      <path class="line" stroke="#00ff9c" d="M340 130 C370 130 370 60 400 60"/>
      <path class="line" stroke="#00ff9c" d="M680 130 C710 130 710 60 740 60"/>
    </g>
    <!-- data flow -->
    <path class="flow" d="M60 60 H740"/>
    <path class="flow" d="M60 60 C100 60 100 130 140 130 H680"/>
    <path class="flow" d="M140 130 C170 130 170 200 200 200 H270 C305 200 305 130 340 130"/>
    <path class="flow" d="M480 130 C510 130 510 200 540 200 H610 C645 200 645 130 680 130"/>

    <!-- release pulses -->
    <circle cx="400" cy="60" r="9" fill="none" stroke="#00ff9c" stroke-width="2">
      <animate attributeName="r" values="9;20;9" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="740" cy="60" r="9" fill="none" stroke="#00ff9c" stroke-width="2">
      <animate attributeName="r" values="9;20;9" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>

    <!-- commits -->
    <g filter="url(#glow)" stroke="#050a07" stroke-width="3">
      <g fill="#00ff9c">
        <circle cx="60" cy="60" r="9"/><circle cx="400" cy="60" r="9"/><circle cx="740" cy="60" r="9"/>
      </g>
      <g fill="#00e5ff">
        <circle cx="140" cy="130" r="9"/><circle cx="260" cy="130" r="9"/><circle cx="340" cy="130" r="9"/>
        <circle cx="480" cy="130" r="9"/><circle cx="600" cy="130" r="9"/><circle cx="680" cy="130" r="9"/>
      </g>
      <g fill="#ff2bd6"><circle cx="200" cy="200" r="9"/><circle cx="270" cy="200" r="9"/></g>
      <g fill="#ffb000"><circle cx="540" cy="200" r="9"/><circle cx="610" cy="200" r="9"/></g>
    </g>

    <!-- labels -->
    <text class="lbl" x="60" y="36">main</text>
    <text class="dim lbl" x="60" y="26">3a9f1c2</text>
    <text class="tag" x="400" y="36">[v1.0.0]</text>
    <text class="dim lbl" x="400" y="26">7be40d1</text>
    <text class="tag" x="740" y="36">[v1.1.0]</text>
    <text class="dim lbl" x="740" y="26">c05d9ae</text>
    <text x="190" y="112" style="fill:#00e5ff">develop</text>
    <text class="lbl" x="235" y="228" style="fill:#ff2bd6">feature/login</text>
    <text class="lbl" x="575" y="228" style="fill:#ffb000">feature/api</text>
  </g>

  <!-- prompt -->
  <text x="20" y="318">root@git:~/repo$ <tspan class="blink">█</tspan></text>

  <!-- scanlines -->
  <rect x="1" y="1" width="798" height="328" rx="10" fill="url(#scan)" pointer-events="none"/>
</svg>
